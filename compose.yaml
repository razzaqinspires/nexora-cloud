name: nexora-cloud
services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexora}
      POSTGRES_USER: ${POSTGRES_USER:-nexora_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      NEXORA_APP_DB_USER: ${NEXORA_APP_DB_USER:-nexora_app}
      NEXORA_APP_DB_PASSWORD: ${NEXORA_APP_DB_PASSWORD:?Set NEXORA_APP_DB_PASSWORD in .env}
    volumes:
      - nexora_pgdata:/var/lib/postgresql/data
      - ./db/init/01-create-app-role.sh:/docker-entrypoint-initdb.d/01-create-app-role.sh:ro
      - ./db/schema.sql:/docker-entrypoint-initdb.d/02-schema.sql:ro
      - ./db/init/03-grant-app-role.sh:/docker-entrypoint-initdb.d/03-grant-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexora_owner} -d ${POSTGRES_DB:-nexora}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - nexora_db
    # PostgreSQL never publishes port 5432 to the host or public internet.

  migrate:
    image: nexora-cloud:0.4.0
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    command: ["node", "scripts/migrate.mjs"]
    environment:
      NEXORA_MIGRATION_DATABASE_URL: postgres://${POSTGRES_USER:-nexora_owner}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-nexora}
      NEXORA_APP_DB_USER: ${NEXORA_APP_DB_USER:-nexora_app}
      NEXORA_APP_DB_PASSWORD: ${NEXORA_APP_DB_PASSWORD:?Set NEXORA_APP_DB_PASSWORD in .env}
      NEXORA_METRICS_AGENT_API_KEY: ${NEXORA_METRICS_AGENT_API_KEY:?Set NEXORA_METRICS_AGENT_API_KEY in .env}
      NEXORA_DATABASE_SSL: "false"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - nexora_db

  app:
    image: nexora-cloud:0.4.0
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["npm", "run", "start:app"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      DATABASE_URL: postgres://${NEXORA_APP_DB_USER:-nexora_app}:${NEXORA_APP_DB_PASSWORD}@db:5432/${POSTGRES_DB:-nexora}
      NEXORA_DATABASE_SSL: "false"
      NEXORA_ADMIN_TOKEN: ${NEXORA_ADMIN_TOKEN:?Set NEXORA_ADMIN_TOKEN in .env}
      NEXORA_PUBLIC_URL: ${NEXORA_PUBLIC_URL:-}
      NEXORA_RUNTIME_MODE: self-hosted
      NEXORA_METRICS_PUBLIC: ${NEXORA_METRICS_PUBLIC:-true}
    ports:
      - "127.0.0.1:${NEXORA_LOCAL_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - nexora_private
      - nexora_db

  backup:
    image: nexora-cloud-backup:0.4.0
    build:
      context: .
      dockerfile: Dockerfile.backup
    restart: unless-stopped
    user: "0:0"
    entrypoint: ["/bin/sh", "/opt/nexora/backup-loop.sh"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexora}
      POSTGRES_USER: ${POSTGRES_USER:-nexora_owner}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      NEXORA_BACKUP_ENCRYPTION_KEY: ${NEXORA_BACKUP_ENCRYPTION_KEY:?Set NEXORA_BACKUP_ENCRYPTION_KEY in .env}
      NEXORA_BACKUP_RETENTION_DAYS: ${NEXORA_BACKUP_RETENTION_DAYS:-30}
      NEXORA_BACKUP_INTERVAL_SECONDS: ${NEXORA_BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - ./scripts/backup-loop.sh:/opt/nexora/backup-loop.sh:ro
      - ./scripts/backup-health.sh:/opt/nexora/backup-health.sh:ro
      - ./backups:/backups
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/bin/sh", "/opt/nexora/backup-health.sh"]
      interval: 1h
      timeout: 5s
      retries: 2
      start_period: 10m
    networks:
      - nexora_db


  metrics-agent:
    image: nexora-cloud:0.4.0
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["node", "scripts/metrics-agent.mjs"]
    environment:
      NEXORA_METRICS_API_URL: http://app:3000
      NEXORA_METRICS_AGENT_API_KEY: ${NEXORA_METRICS_AGENT_API_KEY:?Set NEXORA_METRICS_AGENT_API_KEY in .env}
      NEXORA_METRICS_DATABASE_URL: postgres://${POSTGRES_USER:-nexora_owner}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-nexora}
      NEXORA_METRICS_INTERVAL_SECONDS: ${NEXORA_METRICS_INTERVAL_SECONDS:-60}
      NEXORA_METRICS_PROVIDER: ${NEXORA_METRICS_PROVIDER:-self-hosted}
      NEXORA_METRICS_LOCATION: ${NEXORA_METRICS_LOCATION:-primary-node}
      NEXORA_METRIC_SOURCES_JSON: ${NEXORA_METRIC_SOURCES_JSON:-}
    depends_on:
      app:
        condition: service_healthy
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "const fs=require('fs');try{const t=Date.now()-fs.statSync('/tmp/nexora-metrics-agent.last-success').mtimeMs;if(t>180000)process.exit(1)}catch{process.exit(1)}"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    networks:
      - nexora_private
      - nexora_db

networks:
  nexora_private:
    name: nexora_private
    driver: bridge
  nexora_db:
    name: nexora_db
    driver: bridge
    internal: true

volumes:
  nexora_pgdata:
    name: nexora_pgdata
