name: nexora-cloud
services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexora}
      POSTGRES_USER: ${POSTGRES_USER:-nexora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      NEXORA_APP_DB_USER: ${NEXORA_APP_DB_USER:-nexora_app}
      NEXORA_APP_DB_PASSWORD: ${NEXORA_APP_DB_PASSWORD:?Set NEXORA_APP_DB_PASSWORD in .env}
    volumes:
      - nexora_pgdata:/var/lib/postgresql/data
      - ./db/init/01-create-app-role.sh:/docker-entrypoint-initdb.d/01-create-app-role.sh:ro
      - ./db/schema.sql:/docker-entrypoint-initdb.d/02-schema.sql:ro
      - ./db/init/03-grant-app-role.sh:/docker-entrypoint-initdb.d/03-grant-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexora} -d ${POSTGRES_DB:-nexora}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - nexora_db
    # No host port is published for PostgreSQL.

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: nexora-cloud:0.2.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: "3000"
      DATABASE_URL: postgres://${NEXORA_APP_DB_USER:-nexora_app}:${NEXORA_APP_DB_PASSWORD}@db:5432/${POSTGRES_DB:-nexora}
      DATABASE_SSL: "false"
      NEXORA_ADMIN_TOKEN: ${NEXORA_ADMIN_TOKEN:?Set NEXORA_ADMIN_TOKEN in .env}
    ports:
      # Local-host only by default. Keep private until a VPN/firewall rule is configured.
      - "127.0.0.1:3000:3000"
    networks:
      - nexora_private
      - nexora_db

networks:
  nexora_private:
    name: nexora_private
    driver: bridge
  nexora_db:
    name: nexora_db
    driver: bridge
    internal: true

volumes:
  nexora_pgdata:
    name: nexora_pgdata
